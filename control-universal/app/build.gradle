plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jonaalex.controluniversal'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jonaalex.controluniversal'
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName '2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmada con la llave de depuración para poder instalarla directo en el teléfono.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
